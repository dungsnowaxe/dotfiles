set -g mouse on
set -g default-terminal "tmux-256color"
set -g allow-passthrough on
setw -g mode-keys vi

set -g history-limit 100000
set -g renumber-windows on

# Keep the active window unmistakable across terminal themes
set -g status-style "fg=colour250,bg=colour235"
set -g window-status-style "fg=colour245,bg=colour235"
set -g window-status-format " #I:#W#F "
set -g window-status-current-style "fg=colour231,bg=colour31,bold"
set -g window-status-current-format " [#I:#W#F] "
set -g window-status-activity-style "fg=colour220,bg=colour235,bold"
set -g window-status-separator " "

# Stable, task-oriented names for agent windows
set -g allow-rename off
setw -g automatic-rename off
bind-key N command-prompt -p "Window name:" "rename-window '%%'"

# Identify agents and repositories at a glance
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[bold fg=green],#[dim]}#P #{pane_current_command} · #{b:pane_current_path}#[default] "
setw -g monitor-activity on
set -g visual-activity off

# Navigate and rearrange agent panes
bind-key w choose-tree -Zw
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R
bind-key H swap-pane -U
bind-key L swap-pane -D

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind | split-window -h
bind - split-window -v

bind r source-file ~/.tmux.conf \; display-message "Reloaded"

set -g base-index 1
setw -g pane-base-index 1

set -g extended-keys on
set -g extended-keys-format csi-u
