add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$character
"""

[directory]
truncate_to_repo = false

[git_branch]
symbol = " "

[nodejs]
format = "[$version](bold green) "

# Starship suppresses $nodejs when bun.lock/bunfig.toml is present, so Bun repos
# need $bun or they render no JS runtime at all. Styled to match $nodejs above.
[bun]
format = "[$version](bold red) "

[package]
disabled = true

[cmd_duration]
disabled = true
