onboarding = false

[keys]
# Match ~/.tmux.conf. Press twice to send Ctrl-a to the pane.
prefix = "ctrl+a"
help = "prefix+?"
detach = ["prefix+d", "prefix+q"]
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# Herdr tabs correspond to tmux windows.
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
switch_tab = "prefix+1..9"
rename_tab = ["prefix+shift+n", "prefix+comma"]
close_tab = "prefix+ampersand"
# Free Shift-N for the tmux window-name shortcut.
new_workspace = "prefix+shift+c"
# Closest equivalent to tmux's choose-tree: searchable pane/tab picker.
goto = "prefix+w"
workspace_picker = "prefix+g"

split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]
cycle_pane_next = ["prefix+o", "prefix+tab"]
close_pane = "prefix+x"
zoom = "prefix+z"
# Built in: Shift-H/J/K/L swaps directionally; [ opens Vi copy mode.

[theme]
name = "dracula"
auto_switch = false

[ui]
# Create tabs immediately, as tmux does; rename explicitly when needed.
prompt_new_tab_name = false
